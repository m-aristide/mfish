# =============================================================================
# Déploiement continu (CD) — mfish sur mfish.online
#
# Déclenché automatiquement quand une pull request est fusionnée dans `main`
# (ex. develop -> main), ou manuellement via l'onglet "Actions".
#
# Pipeline :
#   1. Construit l'image Docker (Dockerfile multi-étapes JDK 25 -> JRE 25).
#   2. Publie l'image sur GitHub Container Registry (ghcr.io).
#   3. Se connecte en SSH au serveur mfish.online, tire la nouvelle image
#      et redémarre le service applicatif, puis vérifie /actuator/health.
#
# Secrets GitHub requis (Settings -> Secrets and variables -> Actions) :
#   SSH_HOST          : hôte du serveur (ex. mfish.online ou 100.42.179.74)
#   SSH_USER          : utilisateur SSH (ex. ansible)
#   SSH_PRIVATE_KEY   : contenu de la clé privée (C:\Users\PC\.ssh\warapprod)
#   GH_PAT            : jeton d'accès personnel GitHub (valeur GITHUB_KEY du
#                       .env.prod) avec le scope "read:packages"
#
# Prérequis ponctuel sur le serveur (une seule fois) : voir
# docs/DEPLOIEMENT_CD.md — le service "mfish-app" du docker-compose.prod.yml
# doit référencer "ghcr.io/m-aristide/mfish-app:latest" (et non un build local).
# =============================================================================
name: Déploiement (CD)

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/m-aristide/mfish-app

jobs:
  deploy:
    # Déploie uniquement si une PR vers main a réellement été fusionnée,
    # ou en cas de déclenchement manuel (workflow_dispatch).
    # Pour restreindre à la branche "develop", ajouter :
    #   && github.event.pull_request.head.ref == 'develop'
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer sur le serveur mfish.online
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: m-aristide
          GHCR_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_PAT
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            cd /home/ansible/mfish
            docker compose -f docker-compose.prod.yml pull mfish-app
            docker compose -f docker-compose.prod.yml up -d --no-deps mfish-app

            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health || true)"
              if [ "$code" = "200" ]; then
                echo "OK : application UP -> $(curl -s http://127.0.0.1:8080/actuator/health)"
                exit 0
              fi
              sleep 5
            done

            echo "ECHEC : l'application n'est pas UP après redéploiement."
            docker compose -f docker-compose.prod.yml logs --tail=200 mfish-app
            exit 1
