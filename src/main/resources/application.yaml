spring:
  application:
    name: mfish
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    locale: fr
    locale-resolver: fixed
  messages:
    basename: messages
    encoding: UTF-8
  thymeleaf:
    cache: true
  # Base de donnees : SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME et
  # SPRING_DATASOURCE_PASSWORD sont lues directement depuis l'environnement.

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Aucun secret ici : tout est injecte par variable d'environnement (voir .env.example).
# Les proprietes sont validees au demarrage (voir com.mfish.erp.config).
app:
  timezone: ${APP_TIMEZONE:Africa/Abidjan}
  monnaie:
    devise: ${APP_MONNAIE_DEVISE:FCFA}
  jwt:
    secret: ${APP_JWT_SECRET:}
    validity: 12h
  admin:
    username: admin
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chatwoot:
    base-url: ${CHATWOOT_BASE_URL:}
    api-token: ${CHATWOOT_API_TOKEN:}
    account-id: ${CHATWOOT_ACCOUNT_ID:}
    webhook-secret: ${CHATWOOT_WEBHOOK_SECRET:}
    connect-timeout: 3s
    read-timeout: 10s
    retry:
      max-attempts: 3
      initial-delay: 200ms
      multiplier: 2.0
      max-delay: 2s
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    connect-timeout: 3s
    read-timeout: 30s
    retry:
      max-attempts: 2
      initial-delay: 500ms
      multiplier: 2.0
      max-delay: 4s
  routexl:
    base-url: https://api.routexl.com
    username: ${ROUTEXL_USERNAME:mfish.infos@gmail.com}
    password: ${ROUTEXL_PASSWORD:jinLF.lPNKvtd.0wjApD}
    max-stops: ${ROUTEXL_MAX_STOPS:20}
    connect-timeout: 3s
    read-timeout: 30s
    retry:
      max-attempts: 2
      initial-delay: 500ms
      multiplier: 2.0
      max-delay: 4s
  geocoding:
    provider: ${GEOCODING_PROVIDER:nominatim}
    base-url: https://nominatim.openstreetmap.org
    connect-timeout: 3s
    read-timeout: 10s
    retry:
      max-attempts: 2
      initial-delay: 500ms
      multiplier: 2.0
      max-delay: 2s
