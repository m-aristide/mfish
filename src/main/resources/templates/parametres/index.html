<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{parametres.titre})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('parametres')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section"><h1 th:text="#{parametres.titre}">Parametres</h1></div>

    <h2 th:text="#{parametres.commerce}">Informations du commerce</h2>
    <form class="carte" method="post" th:action="@{/parametres}">
        <div class="grille grille-2">
            <div class="champ">
                <label class="etiquette" for="nomCommerce" th:text="#{parametres.nomCommerce}">Nom du commerce</label>
                <input class="saisie" type="text" id="nomCommerce" name="nomCommerce"
                       th:value="${parametres['nom_commerce']}">
            </div>
            <div class="champ">
                <label class="etiquette" for="telephone" th:text="#{parametres.telephone}">Telephone</label>
                <input class="saisie" type="tel" id="telephone" name="telephone"
                       th:value="${parametres['telephone']}">
            </div>
            <div class="champ">
                <label class="etiquette" for="horaires" th:text="#{parametres.horaires}">Horaires</label>
                <input class="saisie" type="text" id="horaires" name="horaires"
                       th:value="${parametres['horaires']}">
            </div>
            <div class="champ">
                <label class="etiquette" for="fraisLivraison" th:text="#{parametres.zones}">Frais de livraison</label>
                <input class="saisie" type="text" id="fraisLivraison" name="fraisLivraison"
                       th:value="${parametres['frais_livraison']}">
            </div>
        </div>
        <button type="submit" class="bouton" th:text="#{parametres.enregistrer}">Enregistrer</button>
    </form>

    <h2 th:text="#{parametres.utilisateurs}">Utilisateurs</h2>
    <div class="carte">
        <div class="defilement-horizontal">
            <table class="tableau">
                <thead>
                <tr>
                    <th th:text="#{connexion.identifiant}">Identifiant</th>
                    <th th:text="#{parametres.role}">Role</th>
                    <th th:text="#{parametres.actif}">Actif</th>
                    <th><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="utilisateur : ${utilisateurs}">
                    <td th:text="${utilisateur.username()}">Identifiant</td>
                    <td><span class="badge badge-neutre"
                              th:text="#{__${'role.' + utilisateur.role().name()}__}">Role</span></td>
                    <td>
                        <span th:classappend="${utilisateur.actif()} ? 'badge-succes' : 'badge-neutre'"
                              class="badge" th:text="${utilisateur.actif()} ? #{commun.oui} : #{commun.non}">Actif</span>
                    </td>
                    <td>
                        <form th:action="@{/parametres/utilisateurs/{id}/actif(id=${utilisateur.id()})}" method="post">
                            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                            <button type="submit" class="bouton bouton-petit"
                                    th:text="${utilisateur.actif()} ? #{action.desactiver} : #{action.activer}">Basculer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2 th:text="#{parametres.nouvelUtilisateur}">Nouvel utilisateur</h2>
    <form class="carte" th:object="${formulaire}" th:action="@{/parametres/utilisateurs}" method="post">
        <div class="grille grille-2">
            <div class="champ">
                <label class="etiquette" for="username" th:text="#{connexion.identifiant}">Identifiant</label>
                <input class="saisie" type="text" id="username" th:field="*{username}" required>
                <div class="erreur-champ" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Erreur</div>
            </div>
            <div class="champ">
                <label class="etiquette" for="motDePasse" th:text="#{parametres.motDePasse}">Mot de passe</label>
                <input class="saisie" type="password" id="motDePasse" th:field="*{motDePasse}" required>
                <div class="erreur-champ" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}">Erreur</div>
            </div>
            <div class="champ">
                <label class="etiquette" for="role" th:text="#{parametres.role}">Role</label>
                <select class="saisie" id="role" th:field="*{role}" required>
                    <option th:each="r : ${T(com.mfish.erp.utilisateur.Role).values()}" th:value="${r.name()}"
                            th:text="#{__${'role.' + r.name()}__}">Role</option>
                </select>
            </div>
        </div>
        <button type="submit" class="bouton" th:text="#{action.creer}">Creer</button>
    </form>
</main>
<div th:replace="~{layout/layout :: bas('parametres')}"></div>
</body>
</html>
