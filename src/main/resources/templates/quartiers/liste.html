<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{quartier.titre})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('quartiers')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{quartier.titre}">Quartiers</h1>
        <a class="bouton" th:href="@{/quartiers/nouveau}" th:text="#{quartier.nouveau}">Nouveau quartier</a>
    </div>

    <div class="carte">
        <div class="defilement-horizontal">
            <table class="tableau">
                <thead>
                <tr>
                    <th th:text="#{quartier.nom}">Nom</th>
                    <th th:text="#{quartier.zone}">Zone</th>
                    <th th:text="#{quartier.latitude}">Latitude</th>
                    <th th:text="#{quartier.longitude}">Longitude</th>
                    <th th:text="#{quartier.ordreDefaut}">Ordre par defaut</th>
                    <th th:text="#{quartier.actif}">Actif</th>
                    <th><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="quartier : ${quartiers}">
                    <td th:text="${quartier.nom()}">Nom</td>
                    <td th:text="${quartier.zone()}">Zone</td>
                    <td th:text="${quartier.latitude()}">Latitude</td>
                    <td th:text="${quartier.longitude()}">Longitude</td>
                    <td th:text="${quartier.ordreDefaut()}">Ordre</td>
                    <td>
                        <span class="badge"
                              th:classappend="${quartier.actif()} ? 'badge-succes' : 'badge-neutre'"
                              th:text="${quartier.actif()} ? #{quartier.actif} : #{quartier.inactif}">Actif</span>
                    </td>
                    <td>
                        <div class="liste-actions">
                            <a class="bouton bouton-petit bouton-secondaire"
                               th:href="@{/quartiers/{id}/modifier(id=${quartier.id()})}"
                               th:text="#{action.modifier}">Modifier</a>
                            <form th:action="@{/quartiers/{id}/basculer(id=${quartier.id()})}" method="post">
                                <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                                <button type="submit" class="bouton bouton-petit"
                                        th:text="${quartier.actif()} ? #{action.desactiver} : #{action.activer}">Basculer</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(quartiers)}">
                    <td colspan="7" class="etat-vide" th:text="#{quartier.aucun}">Aucun quartier</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{layout/layout :: bas('quartiers')}"></div>
</body>
</html>
