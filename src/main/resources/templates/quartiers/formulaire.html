<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{quartier.nouveau})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('quartiers')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="${quartierId != null} ? #{quartier.modifier} : #{quartier.nouveau}">Quartier</h1>
        <a class="bouton bouton-petit bouton-secondaire" th:href="@{/quartiers}" th:text="#{action.retour}">Retour</a>
    </div>

    <form class="carte" th:object="${formulaire}"
          th:action="${quartierId != null} ? @{/quartiers/{id}(id=${quartierId})} : @{/quartiers}"
          method="post">
        <div class="champ">
            <label class="etiquette" for="nom" th:text="#{quartier.nom}">Nom</label>
            <input class="saisie" type="text" id="nom" th:field="*{nom}" required>
            <div class="erreur-champ" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="zone" th:text="#{quartier.zone}">Zone</label>
            <input class="saisie" type="text" id="zone" th:field="*{zone}">
            <div class="erreur-champ" th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="latitude" th:text="#{quartier.latitude}">Latitude</label>
            <input class="saisie" type="number" step="any" min="-90" max="90" id="latitude"
                   th:field="*{latitude}">
            <div class="erreur-champ" th:if="${#fields.hasErrors('latitude')}"
                 th:errors="*{latitude}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="longitude" th:text="#{quartier.longitude}">Longitude</label>
            <input class="saisie" type="number" step="any" min="-180" max="180" id="longitude"
                   th:field="*{longitude}">
            <div class="erreur-champ" th:if="${#fields.hasErrors('longitude')}"
                 th:errors="*{longitude}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="ordreDefaut" th:text="#{quartier.ordreDefaut}">Ordre par defaut</label>
            <input class="saisie" type="number" min="0" id="ordreDefaut" th:field="*{ordreDefaut}" required>
            <div class="erreur-champ" th:if="${#fields.hasErrors('ordreDefaut')}"
                 th:errors="*{ordreDefaut}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="actif" th:text="#{quartier.actif}">Actif</label>
            <input type="checkbox" id="actif" th:field="*{actif}">
        </div>
        <button type="submit" class="bouton" th:text="#{action.enregistrer}">Enregistrer</button>
    </form>
</main>
<div th:replace="~{layout/layout :: bas('quartiers')}"></div>
</body>
</html>
