<div id="liste-tournee" th:fragment="liste">
    <div th:if="${erreurTournee}" class="flash flash-erreur" th:text="#{tournee.calculErreur}">Erreur</div>
    <div th:if="${#lists.isEmpty(tournee.arrets())}" class="etat-vide" th:text="#{tournee.aucune}">Aucune tournee</div>

    <table class="table-tournee" th:unless="${#lists.isEmpty(tournee.arrets())}">
        <thead>
        <tr>
            <th th:text="#{tournee.position}">Arrêt</th>
            <th th:text="#{client.nom}">Nom</th>
            <th th:text="#{client.quartier}">Quartier</th>
            <th th:text="#{tournee.montantEncaisser}">Montant</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="arret : ${tournee.arrets()}">
            <td>
                <span class="texte-important" th:text="${arret.position() + 1}">1</span>
                <span th:if="${arret.heureEstimee() != null}"
                      th:text="${#temporals.format(arret.heureEstimee(), 'HH:mm')}">HH:mm</span>
            </td>
            <td>
                <div th:text="${arret.clientNom()}">Nom</div>
                <div class="liste-actions" style="margin-top: 0.25rem;">
                    <a class="bouton bouton-petit" th:href="'tel:' + ${arret.clientTelephone()}"
                       th:text="#{tournee.appeler}">Appeler</a>
                    <a class="bouton bouton-petit"
                       th:href="'https://wa.me/' + ${#strings.replace(arret.clientTelephone(), '+', '')}"
                       th:text="#{tournee.whatsapp}">WhatsApp</a>
                </div>
            </td>
            <td>
                <div th:text="${arret.quartierNom()}">Quartier</div>
                <a class="bouton bouton-petit bouton-secondaire" style="margin-top: 0.25rem;"
                   th:href="'https://www.google.com/maps/search/?api=1&query=' + ${arret.quartierNom()} + ' ' + ${arret.adresse()}"
                   th:text="#{tournee.navigation}">Itinéraire</a>
            </td>
            <td class="texte-important" th:text="${arret.montantTotalFormate()}">Montant</td>
            <td>
                <form hx-post th:action="@{/tournee/arrets/{id}(id=${arret.id()})}"
                      hx-target="#liste-tournee" hx-swap="outerHTML" class="liste-actions">
                    <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                    <input type="hidden" name="date" th:value="${dateSelectionnee}">
                    <input type="hidden" name="statut" value="LIVRE">
                    <input class="saisie" type="number" name="montant" min="0" th:value="${arret.restant()}"
                           th:attr="aria-label=#{tournee.montant}" style="max-width: 7rem;">
                    <button type="submit" class="bouton bouton-petit" th:text="#{tournee.livre}">Livre</button>
                </form>
            </td>
            <td>
                <div class="liste-actions">
                    <form hx-post th:action="@{/tournee/arrets/{id}(id=${arret.id()})}"
                          hx-target="#liste-tournee" hx-swap="outerHTML">
                        <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                        <input type="hidden" name="date" th:value="${dateSelectionnee}">
                        <input type="hidden" name="statut" value="ABSENT">
                        <input type="hidden" name="montant" value="0">
                        <button type="submit" class="bouton bouton-petit bouton-danger"
                                th:text="#{tournee.absent}">Absent</button>
                    </form>
                    <form hx-post th:action="@{/tournee/arrets/{id}(id=${arret.id()})}"
                          hx-target="#liste-tournee" hx-swap="outerHTML">
                        <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                        <input type="hidden" name="date" th:value="${dateSelectionnee}">
                        <input type="hidden" name="statut" value="REPORTE">
                        <input type="hidden" name="montant" value="0">
                        <button type="submit" class="bouton bouton-petit bouton-secondaire"
                                th:text="#{tournee.reporter}">Reporter</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
