<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{client.nouveau})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('clients')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="${clientId != null} ? #{client.modifier} : #{client.nouveau}">Client</h1>
        <a class="bouton bouton-petit bouton-secondaire" th:href="@{/clients}" th:text="#{action.retour}">Retour</a>
    </div>

    <form class="carte" th:object="${formulaire}"
          th:action="${clientId != null} ? @{/clients/{id}(id=${clientId})} : @{/clients}" method="post">
        <div class="champ">
            <label class="etiquette" for="nom" th:text="#{client.nom}">Nom</label>
            <input class="saisie" type="text" id="nom" th:field="*{nom}" required>
            <div class="erreur-champ" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="telephone" th:text="#{client.telephone}">Telephone</label>
            <input class="saisie" type="tel" id="telephone" th:field="*{telephone}" required>
            <div class="erreur-champ" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}">Erreur</div>
        </div>
        <div class="champ">
            <label class="etiquette" for="quartierId" th:text="#{client.quartier}">Quartier</label>
            <select class="saisie" id="quartierId" th:field="*{quartierId}">
                <option value="" th:text="#{commun.optionnel}">Optionnel</option>
                <option th:each="q : ${quartiers}" th:value="${q.id()}" th:text="${q.nom()}">Quartier</option>
            </select>
        </div>
        <div class="champ">
            <label class="etiquette" for="adresse" th:text="#{client.adresse}">Adresse</label>
            <input class="saisie" type="text" id="adresse" th:field="*{adresse}">
        </div>
        <div class="champ">
            <label class="etiquette" for="repere" th:text="#{client.repere}">Repere</label>
            <input class="saisie" type="text" id="repere" th:field="*{repere}">
        </div>
        <div class="champ">
            <label class="etiquette" for="notes" th:text="#{client.notes}">Notes</label>
            <textarea class="saisie" id="notes" th:field="*{notes}"></textarea>
        </div>
        <button type="submit" class="bouton" th:text="#{action.enregistrer}">Enregistrer</button>
    </form>
</main>
<div th:replace="~{layout/layout :: bas('clients')}"></div>
</body>
</html>
