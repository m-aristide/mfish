<div id="liste-clients" th:fragment="liste">
    <div class="defilement-horizontal">
        <table class="tableau">
            <thead>
            <tr>
                <th th:text="#{client.nom}">Nom</th>
                <th th:text="#{client.telephone}">Telephone</th>
                <th th:text="#{client.quartier}">Quartier</th>
                <th><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${page.content}">
                <td><a th:href="@{/clients/{id}(id=${client.id()})}" th:text="${client.nom()}">Nom</a></td>
                <td th:text="${client.telephone()}">Telephone</td>
                <td th:text="${client.quartierId() != null ? quartierNoms[client.quartierId()] : ''}">Quartier</td>
                <td><a class="bouton bouton-petit" th:href="@{/clients/{id}(id=${client.id()})}"
                       th:text="#{action.voir}">Voir</a></td>
            </tr>
            <tr th:if="${page.empty}">
                <td colspan="4" class="etat-vide" th:text="#{client.aucun}">Aucun client</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination" th:if="${page.totalPages > 1}" aria-label="Pagination">
        <a class="bouton bouton-petit bouton-secondaire" th:if="${page.number > 0}"
           th:href="@{/clients(recherche=${recherche}, page=${page.number - 1})}"
           th:text="#{pagination.precedent}">Precedent</a>
        <span th:text="#{pagination.page} + ' ' + ${page.number + 1} + ' ' + #{pagination.sur} + ' ' + ${page.totalPages}">Page</span>
        <a class="bouton bouton-petit bouton-secondaire" th:if="${page.number + 1 < page.totalPages}"
           th:href="@{/clients(recherche=${recherche}, page=${page.number + 1})}"
           th:text="#{pagination.suivant}">Suivant</a>
    </nav>
</div>
