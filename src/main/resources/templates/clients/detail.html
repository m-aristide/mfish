<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{client.detail})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('clients')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{client.detail}">Client</h1>
        <div class="liste-actions">
            <a class="bouton bouton-petit bouton-secondaire" th:href="@{/clients}"
               th:text="#{action.retour}">Retour</a>
            <a class="bouton bouton-petit" th:href="@{/clients/{id}/modifier(id=${client.id()})}"
               th:text="#{action.modifier}">Modifier</a>
            <form th:action="@{/clients/{id}/archiver(id=${client.id()})}" method="post">
                <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                <button type="submit" class="bouton bouton-petit bouton-danger"
                        th:text="#{client.archiver}">Archiver</button>
            </form>
        </div>
    </div>

    <div class="carte">
        <div class="detail-ligne"><span class="libelle" th:text="#{client.nom}">Nom</span>
            <span th:text="${client.nom()}">Nom</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.telephone}">Telephone</span>
            <span th:text="${client.telephone()}">Telephone</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.quartier}">Quartier</span>
            <span th:text="${quartierNom}">Quartier</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.adresse}">Adresse</span>
            <span th:text="${client.adresse()}">Adresse</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.repere}">Repere</span>
            <span th:text="${client.repere()}">Repere</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.notes}">Notes</span>
            <span th:text="${client.notes()}">Notes</span></div>
    </div>

    <h2 th:text="#{client.historique}">Historique des commandes</h2>
    <div class="carte">
        <div class="defilement-horizontal">
            <table class="tableau">
                <thead>
                <tr>
                    <th th:text="#{commande.date}">Date</th>
                    <th th:text="#{commande.statut}">Statut</th>
                    <th th:text="#{commande.montant}">Montant</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="commande : ${commandes}">
                    <td th:text="${commande.dateLivraisonSouhaitee() != null ? #temporals.format(commande.dateLivraisonSouhaitee(), 'dd/MM/yyyy') : ''}">Date</td>
                    <td><span class="badge badge-neutre"
                              th:text="#{__${'statut.' + commande.statut().name()}__}">Statut</span></td>
                    <td th:text="${@monnaieMapper.formater(commande.montantTotal())}">Montant</td>
                </tr>
                <tr th:if="${#lists.isEmpty(commandes)}">
                    <td colspan="3" class="etat-vide" th:text="#{commande.aucune}">Aucune commande</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{layout/layout :: bas('clients')}"></div>
</body>
</html>
