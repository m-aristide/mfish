<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{conversation.titre})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('conversations')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{conversation.titre}">Conversation</h1>
        <a class="bouton bouton-petit bouton-secondaire" th:href="@{/conversations}" th:text="#{action.retour}">Retour</a>
    </div>

    <div class="carte">
        <div class="detail-ligne"><span class="libelle" th:text="#{client.nom}">Client</span>
            <span th:text="${conversation.clientNom()}">Client</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.telephone}">Telephone</span>
            <span th:text="${conversation.clientTelephone()}">Telephone</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{conversation.mode}">Mode</span>
            <span class="badge badge-neutre" th:text="#{__${'statut.' + conversation.mode().name()}__}">Mode</span></div>
    </div>

    <div class="liste-actions" style="margin-top: 1rem;">
        <form th:action="@{/conversations/{id}/mode(id=${conversation.id()})}" method="post">
            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
            <input type="hidden" name="mode" value="HUMAIN">
            <button type="submit" class="bouton" th:text="#{conversation.reprendre}">Reprendre la main</button>
        </form>
        <form th:action="@{/conversations/{id}/mode(id=${conversation.id()})}" method="post">
            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
            <input type="hidden" name="mode" value="IA">
            <button type="submit" class="bouton bouton-secondaire" th:text="#{conversation.rendreIA}">Rendre a l'IA</button>
        </form>
        <a th:if="${chatwootBaseUrl != null and !chatwootBaseUrl.isBlank()}" class="bouton bouton-accent"
           th:href="${chatwootBaseUrl}" th:text="#{conversation.repondre}">Repondre dans Chatwoot</a>
    </div>

    <p class="texte-doux" style="margin-top: 1rem;" th:text="#{conversation.lectureSeule}">Historique en lecture seule</p>
</main>
<div th:replace="~{layout/layout :: bas('conversations')}"></div>
</body>
</html>
