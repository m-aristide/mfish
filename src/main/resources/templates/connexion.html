<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{connexion.titre} + ' · mfish'">Connexion · mfish</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="enveloppe">
    <div class="carte" style="max-width: 24rem; margin: 4rem auto;">
        <h1 th:text="#{app.nom}">mfish</h1>
        <div th:replace="~{layout/layout :: flash}"></div>
        <form th:action="@{/connexion}" method="post">
            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
            <div class="champ">
                <label class="etiquette" for="username" th:text="#{connexion.identifiant}">Identifiant</label>
                <input class="saisie" type="text" id="username" name="username"
                       autocomplete="username" required>
            </div>
            <div class="champ">
                <label class="etiquette" for="password" th:text="#{connexion.motDePasse}">Mot de passe</label>
                <input class="saisie" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="bouton" th:text="#{connexion.seConnecter}">Se connecter</button>
        </form>
    </div>
</main>
</body>
</html>
