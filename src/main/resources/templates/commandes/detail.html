<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{commande.detail})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('commandes')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{commande.detail}">Commande</h1>
        <a class="bouton bouton-petit bouton-secondaire" th:href="@{/commandes}" th:text="#{action.retour}">Retour</a>
    </div>

    <div class="carte">
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.client}">Client</span>
            <span th:text="${commande.clientNom()} + ' — ' + ${commande.clientTelephone()}">Client</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{client.quartier}">Quartier</span>
            <span th:text="${commande.quartierNom()}">Quartier</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.date}">Date</span>
            <span th:text="${commande.date() != null ? #temporals.format(commande.date(), 'dd/MM/yyyy') : ''}">Date</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.statut}">Statut</span>
            <span class="badge badge-neutre" th:text="#{__${commande.statut()}__}">Statut</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.paiement}">Paiement</span>
            <span th:text="#{__${commande.modePaiement()}__}">Paiement</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.total}">Total</span>
            <span class="texte-important" th:text="${commande.montantTotalFormate()}">Total</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.montantPaye}">Encaissé</span>
            <span th:text="${commande.montantPayeFormate()}">Encaissé</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{dashboard.aEncaisser}">Restant</span>
            <span th:text="${commande.restantFormate()}">Restant</span></div>
        <div class="detail-ligne"><span class="libelle" th:text="#{commande.notes}">Notes</span>
            <span th:text="${commande.notes()}">Notes</span></div>
    </div>

    <h2 th:text="#{commande.produits}">Produits</h2>
    <div class="carte">
        <div class="defilement-horizontal">
            <table class="tableau">
                <thead>
                <tr>
                    <th th:text="#{produit.nom}">Produit</th>
                    <th th:text="#{commande.quantite}">Quantite</th>
                    <th th:text="#{commande.prixUnitaire}">Prix unitaire</th>
                    <th th:text="#{commande.sousTotal}">Sous-total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ligne : ${commande.lignes()}">
                    <td th:text="${ligne.produitNom()}">Produit</td>
                    <td th:text="${ligne.quantite()}">1</td>
                    <td th:text="${ligne.prixUnitaireFormate()}">Prix</td>
                    <td th:text="${ligne.sousTotalFormate()}">Sous-total</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2 th:text="#{commande.changerStatut}">Changer le statut</h2>
    <div class="carte">
        <form th:action="@{/commandes/{id}/statut(id=${commande.id()})}" method="post">
            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
            <div class="champ">
                <select class="saisie" name="statut" aria-label="statut">
                    <option th:each="s : ${T(com.mfish.erp.commande.StatutCommande).values()}"
                            th:value="${s.name()}" th:text="#{__${'statut.' + s.name()}__}">Statut</option>
                </select>
            </div>
            <button type="submit" class="bouton" th:text="#{commande.changerStatut}">Changer le statut</button>
        </form>
    </div>

    <h2 th:text="#{commande.encaisser}">Encaisser</h2>
    <div class="carte">
        <form th:action="@{/commandes/{id}/paiements(id=${commande.id()})}" method="post">
            <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
            <div class="champ">
                <label class="etiquette" for="montant" th:text="#{tournee.montant}">Montant</label>
                <input class="saisie" type="number" id="montant" name="montant" min="1"
                       th:value="${commande.restant()}" required>
            </div>
            <button type="submit" class="bouton" th:text="#{commande.encaisser}">Encaisser</button>
        </form>
    </div>

    <button type="button" class="bouton bouton-danger" data-bascule="dialog-annulation"
            th:text="#{commande.annuler}">Annuler la commande</button>
</main>

<div id="dialog-annulation" class="cache dialogue-fond">
    <div class="dialogue">
        <p th:text="#{commande.annulerConfirmation}">Confirmer l'annulation de la commande ?</p>
        <div class="liste-actions">
            <form th:action="@{/commandes/{id}/annulation(id=${commande.id()})}" method="post">
                <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                <button type="submit" class="bouton bouton-danger" th:text="#{action.confirmer}">Confirmer</button>
            </form>
            <button type="button" class="bouton bouton-secondaire" data-bascule="dialog-annulation"
                    th:text="#{action.annuler}">Annuler</button>
        </div>
    </div>
</div>

<div th:replace="~{layout/layout :: bas('commandes')}"></div>
</body>
</html>
