<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{commande.nouvelle})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('commandes')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{commande.nouvelle}">Nouvelle commande</h1>
        <a class="bouton bouton-petit bouton-secondaire" th:href="@{/commandes}" th:text="#{action.retour}">Retour</a>
    </div>

    <form class="carte" th:object="${formulaire}" th:action="@{/commandes}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="flash flash-erreur">
            <span th:each="erreur : ${#fields.globalErrors()}" th:text="${erreur}">Erreur</span>
        </div>

        <div class="champ">
            <label class="etiquette" for="clientId" th:text="#{commande.client}">Client</label>
            <select class="saisie" id="clientId" name="clientId" required>
                <option value="" th:text="#{commande.client}">Choisir un client</option>
                <option th:each="client : ${clients}" th:value="${client.id()}"
                        th:text="${client.nom()} + ' — ' + ${client.telephone()}">Client</option>
            </select>
        </div>

        <div class="champ">
            <label class="etiquette" th:text="#{commande.produits}">Produits</label>
            <div th:each="produit, stat : ${produits}" class="detail-ligne">
                <span th:text="${produit.nom()}">Produit</span>
                <input type="hidden" th:name="'lignes[' + ${stat.index} + '].produitId'"
                       th:value="${produit.id()}">
                <input class="saisie" type="number" min="0" style="max-width: 6rem;"
                       th:name="'lignes[' + ${stat.index} + '].quantite'"
                       th:attr="aria-label=${produit.nom()}" value="0">
            </div>
        </div>

        <div class="champ">
            <label class="etiquette" for="modePaiement" th:text="#{commande.paiement}">Paiement</label>
            <select class="saisie" id="modePaiement" name="modePaiement" required>
                <option th:each="mode : ${T(com.mfish.erp.commande.ModePaiement).values()}"
                        th:value="${mode.name()}"
                        th:text="#{__${'paiement.' + mode.name()}__}">Paiement</option>
            </select>
        </div>

        <div class="champ">
            <label class="etiquette" for="dateLivraisonSouhaitee" th:text="#{commande.date}">Date de livraison</label>
            <input class="saisie" type="date" id="dateLivraisonSouhaitee" name="dateLivraisonSouhaitee">
        </div>

        <div class="champ">
            <label class="etiquette" for="notes" th:text="#{commande.notes}">Notes</label>
            <textarea class="saisie" id="notes" name="notes"></textarea>
        </div>

        <button type="submit" class="bouton" th:text="#{action.enregistrer}">Enregistrer</button>
    </form>
</main>
<div th:replace="~{layout/layout :: bas('commandes')}"></div>
</body>
</html>
