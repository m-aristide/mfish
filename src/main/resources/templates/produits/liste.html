<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head(#{produit.titre})}"></head>
<body>
<header th:replace="~{layout/layout :: haut('produits')}"></header>
<main class="enveloppe">
    <div th:replace="~{layout/layout :: flash}"></div>
    <div class="titre-section">
        <h1 th:text="#{produit.titre}">Produits</h1>
        <a class="bouton" th:href="@{/produits/nouveau}" th:text="#{produit.nouveau}">Nouveau produit</a>
    </div>

    <div class="carte">
        <div class="defilement-horizontal">
            <table class="tableau">
                <thead>
                <tr>
                    <th th:text="#{produit.image}">Image</th>
                    <th th:text="#{produit.nom}">Nom</th>
                    <th th:text="#{produit.prix}">Prix</th>
                    <th th:text="#{produit.unite}">Unite</th>
                    <th th:text="#{produit.actif}">Actif</th>
                    <th><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produit : ${produits}">
                    <td>
                        <img th:src="${produit.image()}" th:alt="${produit.nom()}"
                             style="max-width: 4rem; max-height: 4rem; object-fit: cover; border-radius: 0.5rem;">
                    </td>
                    <td th:text="${produit.nom()}">Nom</td>
                    <td th:text="${@monnaieMapper.formater(produit.prix())}">Prix</td>
                    <td th:text="${produit.unite()}">Unite</td>
                    <td>
                        <span th:classappend="${produit.actif()} ? 'badge-succes' : 'badge-neutre'"
                              class="badge"
                              th:text="${produit.actif()} ? #{produit.actif} : #{produit.inactif}">Actif</span>
                    </td>
                    <td>
                        <div class="liste-actions">
                            <a class="bouton bouton-petit bouton-secondaire"
                               th:href="@{/produits/{id}/modifier(id=${produit.id()})}"
                               th:text="#{action.modifier}">Modifier</a>
                            <form th:action="@{/produits/{id}/basculer(id=${produit.id()})}" method="post">
                                <input type="hidden" th:name="${csrf.parameterName}" th:value="${csrf.token}">
                                <button type="submit" class="bouton bouton-petit"
                                        th:text="${produit.actif()} ? #{produit.desactiver} : #{action.activer}">Basculer</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produits)}">
                    <td colspan="6" class="etat-vide" th:text="#{produit.aucun}">Aucun produit</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{layout/layout :: bas('produits')}"></div>
</body>
</html>
