# Profil de production : aucune valeur par defaut pour la base ni pour les secrets.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.mfish.erp: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
