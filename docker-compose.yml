name: mfish

# Environnement commun aux services Chatwoot (web + worker).
x-chatwoot-environnement: &chatwoot-environnement
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-}
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
  POSTGRES_HOST: chatwoot-postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-change-me}
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-change-me}@redis:6379
  RAILS_LOG_TO_STDOUT: "true"
  # Autorise les webhooks vers le reseau local (host.docker.internal, 192.168.x.x).
  # Reglage de DEVELOPPEMENT : sans lui, la protection SSRF de Chatwoot refuse l'URL.
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mfish}
      POSTGRES_USER: ${POSTGRES_USER:-mfish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mfish} -d ${POSTGRES_DB:-mfish}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mfish}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mfish}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Abidjan}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      ROUTEXL_USERNAME: ${ROUTEXL_USERNAME:-}
      ROUTEXL_PASSWORD: ${ROUTEXL_PASSWORD:-}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${CHATWOOT_REDIS_PASSWORD:-change-me}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CHATWOOT_REDIS_PASSWORD:-change-me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot-postgres:
    # Chatwoot 4.x requiert l'extension PostgreSQL "vector" (pgvector) pour son schéma.
    # L'image postgres:16-alpine ne la fournit pas -> utiliser pgvector/pgvector:pg16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-change-me}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot:
    image: chatwoot/chatwoot:latest
    # L'image par défaut lance "irb" (prévue pour les tâches ponctuelles).
    # Sans cette commande, le conteneur web s'arrête aussitôt (exit 0).
    command: ["bundle", "exec", "rails", "s", "-b", "0.0.0.0", "-p", "3000"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      <<: *chatwoot-environnement
    volumes:
      - chatwoot_storage:/app/storage

  # Worker Sidekiq : indispensable pour l'envoi des webhooks et des taches de fond.
  # Sans ce service, Chatwoot recoit les messages mais ne notifie jamais l'application.
  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *chatwoot-environnement
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  chatwoot_postgres_data:
  chatwoot_storage:
